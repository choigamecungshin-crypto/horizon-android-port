[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Android NativeActivity entry point for the Horizon game client"

[lib]
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
horizon-launcher = { path = "../../launcher" }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"

[lints]
workspace = true
