[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Android NativeActivity entry point for the Horizon game client"

[lib]
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
horizon-client = { path = "../../crates/horizon-client", default-features = false, features = ["audio"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
